# Helm values for the notification-dispatcher service
replicaCount: 3
revisionHistoryLimit: 5

image:
  repository: registry.internal/notification-dispatcher
  tag: "2.3.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
      cpu: 500m
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

probes:
  liveness:
    path: /healthz
    port: 8080
  readiness:
      path: /ready
      port: 8080

service:
  type: ClusterIP
  port: 8080
