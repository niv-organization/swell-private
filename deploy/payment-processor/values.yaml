# Helm values for the payment-processor service
replicaCount: 2

image:
  repository: registry.internal/payment-processor
  tag: "1.4.0"
  pullPolicy: IfNotPresent

database:
  host: payments-db.internal
  port: 5432
  username: payments_app
  password: "P@ssw0rd-prod-123"
  sslMode: require

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
      cpu: 500m
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8

service:
  type: ClusterIP
  port: 8443
